# ============================================================
#  InsurAI – Spring Boot Application Configuration
# ============================================================

spring:
  application:
    name: insurai-backend

  # ── Database ────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/insurai?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: devil
    password: devil
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update           # use 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true

  # ── Email (SMTP) ─────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── Server ──────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api

# ── JWT Security ─────────────────────────────────────────────
jwt:
  secret: InsurAI_Super_Secret_Key_2026_Corporate_Insurance_System_JWT_256bits
  expiration: 86400000       # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days

# ── App Config ───────────────────────────────────────────────
insurai:
  frontend-url: http://localhost:3000
  email-from: noreply@insurai.com
  sms:
    provider: twilio
    account-sid: your_twilio_account_sid
    auth-token: your_twilio_auth_token
    from-number: +1XXXXXXXXXX

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    com.insurai: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%-5level] %logger{36} - %msg%n"

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
