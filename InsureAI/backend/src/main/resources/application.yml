spring:
  application:
    name: insurai-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  sql:
    init:
      mode: never
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: InsurAI_Super_Secret_Key_2026_Corporate_Insurance_System_JWT_256bits
  expiration: 86400000
  refresh-expiration: 604800000

insurai:
  frontend-url: http://localhost:5173
  email-from: noreply@insurai.com
  sms:
    provider: twilio
    account-sid: your_twilio_account_sid
    auth-token: your_twilio_auth_token
    from-number: +1XXXXXXXXXX

logging:
  level:
    com.insurai: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%-5level] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
